name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Select an available iPhone simulator
      id: simulator
      run: |
        xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
        python3 - <<'PY'
        import json
        import os
        import re

        with open(os.path.join(os.environ["RUNNER_TEMP"], "simulators.json")) as file:
            runtimes = json.load(file)["devices"]
        candidates = []
        for runtime, devices in runtimes.items():
            match = re.search(r"\.iOS-(\d+)-(\d+)(?:-(\d+))?$", runtime)
            if not match:
                continue
            version = tuple(int(part or 0) for part in match.groups())
            if version < (18, 6, 0):
                continue
            for device in devices:
                if device["isAvailable"] and device["name"].startswith("iPhone"):
                    candidates.append((version, device["udid"]))
        if not candidates:
            raise SystemExit("An available iPhone simulator running iOS 18.6 or newer is required.")
        _, simulator_id = max(candidates)
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"destination=platform=iOS Simulator,id={simulator_id}\n")
        PY
    - name: Build and run unit and UI tests
      run: >-
        xcodebuild test
        -project bleepkit.xcodeproj
        -scheme bleepkit
        -destination '${{ steps.simulator.outputs.destination }}'
        CODE_SIGNING_ALLOWED=NO
